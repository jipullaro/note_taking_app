repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Python (backend/) - lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: ruff (backend lint)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff (backend format)
        files: ^backend/

  # JS/TS (frontend/) - lint via the project's own eslint config
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend)
        entry: npm --prefix frontend run lint --
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|mjs|cjs)$
        pass_filenames: false
