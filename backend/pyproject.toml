[project]
name = "backend"
version = "0.1.0"
description = "Note-taking app backend (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "Django==5.1.4",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "django-cors-headers==4.6.0",
    "psycopg[binary]==3.2.3",
    "celery[redis]==5.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-django>=4.9.0",
    "ruff>=0.8.4",
]

# No [build-system] table: this is an application, not a distributable
# package. Without package = false, `uv sync` would try to build and install
# "backend" into the environment and fail.
[tool.uv]
package = false

# --- Vercel ---
# Vercel would find the WSGI app on its own (it runs manage.py, reads
# DJANGO_SETTINGS_MODULE, then WSGI_APPLICATION); it's stated explicitly
# because the subscriber below has to be declared here anyway, and a file
# that names one entrypoint and silently infers the other is worse to read.
[tool.vercel]
entrypoint = "config.wsgi:application"

# The Celery worker, built as a private Function that only Vercel Queues can
# invoke — this is what replaces the long-lived `celery worker` process in
# docker-compose. `topics` must match CELERY_TASK_DEFAULT_QUEUE in
# config/settings/base.py or published tasks land on a topic nobody reads.
[[tool.vercel.subscribers]]
entrypoint = "worker:app"
topics = ["celery"]
# Queues deliver at least once and retry anything that raises or times out.
# The purge is idempotent (it deletes by a time cutoff, so a redelivery just
# finds nothing left), so a retry is free; concurrency is capped low because
# every concurrent task holds a Postgres connection.
retry_after_seconds = 60
max_concurrency = 5

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["accounts", "notes"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["**/migrations/*"]

[tool.ruff.lint]
extend-select = ["I"]  # isort-style import sorting
