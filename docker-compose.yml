# The backend image is shared by three services (the API, the Celery worker
# and beat), which differ only in their command. The anchor below keeps the
# build context, env and volumes in one place so they can't drift apart —
# in particular the ./backend:/app bind mount, which every one of them needs
# (see the comment on it).
x-backend: &backend
  build: ./backend
  # Without this mount the worker and beat run the code baked into the image
  # while `backend` runs the mounted working copy — so the task you're
  # editing is not the task that runs, and nothing says so.
  volumes:
    - ./backend:/app
  env_file: .env
  environment:
    # The settings default is localhost, which is right for a process on the
    # host but points at the container itself in here. Defaulting it to the
    # service name means the stack works even against a .env written before
    # this variable existed — .env still wins if it sets one.
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Published like Postgres is, so a worker run from the host (see
    # backend/Makefile) can reach the same broker the containers use.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    # On this service rather than on the x-backend anchor above, even though
    # the anchor is where the shared configuration goes. worker and beat pull
    # that anchor in too, and neither serves HTTP — they'd fail this check
    # forever while doing their job perfectly well.
    healthcheck:
      # There is no curl in python:3.12-slim, but the interpreter that's
      # already here can make the request. urlopen raises on the 503 the
      # endpoint returns when the database is unreachable, which is exactly
      # the non-zero exit compose is looking for.
      #
      # No URL prefix: URL_PREFIX is empty outside production, because here
      # Django has its own port and owns "/" (see config/settings/base.py).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # `command` runs migrations before the server binds, so the first
      # probes of a cold stack land before anything is listening. Failures
      # inside start_period don't count against retries.
      start_period: 30s

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    # --schedule keeps beat's shelve database in /tmp. Left at its default it
    # writes celerybeat-schedule into the working directory, which is the
    # bind-mounted repo.
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file: .env
    healthcheck:
      # node:22-alpine has no curl either, and node 22 has fetch built in.
      # `r.ok` is the whole point: a reachable server answering 503 is a
      # failure, and without this it would still exit 0 as a completed fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      # Roomier than the backend's: this runs `next dev`, which compiles the
      # route on the first request that reaches it.
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      # Was a bare list, which only waits for the container to be created —
      # so the frontend used to come up against a backend still running
      # migrations. Now that the backend reports readiness, wait for it.
      backend:
        condition: service_healthy

volumes:
  pgdata:
